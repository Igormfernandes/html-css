<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <P>
                <label for="inome" >Nome</label>
                <input type="text" name="nome" id="inome" required minlength="5" maxlength="20">
            </P>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="@email.com">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(d\{2}\) d{4,5}-\d{4}$" placeholder="(00) 0000-0000" required >
            </p>
        </fieldset>
        <!--pattern="^\(d\{2}\) d{4,5}-\d{4}$"  pattern="^[0-9]{4}-[0-9]{4}$"-->
        <!-- ESTUDAR MAIS SOBRE REGEX-->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
