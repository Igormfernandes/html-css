<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 13 Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 500px;
            text-align: center; /* Centraliza o conteúdo numérico por padrão */
        }

        th, td {
            border: 1px solid black;
            padding: 8px 10px;
        }

        /* Estilo dos cabeçalhos e barras de média total */
        thead, .destaque {
            background-color: #5d5d5d;
            color: white;
            font-weight: bold;
        }

        /* Ajuste específico para a linha de baixo do cabeçalho */
        thead tr th {
            background-color: #5d5d5d;
            color: white;
        }

        /* Coluna da esquerda (Áreas) */
        .area {
            background-color: #e3e3e3;
            color: black;
            font-weight: bold;
            font-size: 1.1em;
        }

        /* Coluna das Disciplinas */
        .disciplina {
            text-align: left;
            color: black;
            font-weight: normal;
        }

        /* Alinhamento para o texto da média por área */
        .media-total {
            text-align: left;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Desafio de tabelas</h1>

    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <!-- O segredo está aqui: colspan="2" em vez de rowspan -->
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <!-- BLOCO EXATAS -->
            <tr>
                <th rowspan="4" class="area">Exatas</th>
                <td class="disciplina">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disciplina">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disciplina">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disciplina">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="destaque">
                <th colspan="4" class="media-total">Média de Exatas</th>
                <td>0.0</td>
            </tr>

            <!-- BLOCO HUMANAS -->
            <tr>
                <th rowspan="2" class="area">Humanas</th>
                <td class="disciplina">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disciplina">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="destaque">
                <th colspan="4" class="media-total">Média de Humanas</th>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
